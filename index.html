<title>屋上、焼いてかない？</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
.game{max-width:1100px;margin:0 auto;background:#111827;min-height:100vh}
header{height:44px;padding:10px 15px;background:#111827;display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:14px}
#chapter{color:#cbd5e1;font-weight:500}
.stage{position:relative;width:100%;aspect-ratio:16/9;min-height:320px;overflow:hidden;background:#263244}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.bg.active{display:block}
.dialogue-area{position:absolute;left:3%;right:3%;bottom:3%}
.name{display:none;width:max-content;max-width:100%;padding:7px 20px;background:#17213aee;border:1px solid #fff;border-bottom:0;border-radius:10px 10px 0 0;font-weight:800}
.box{position:relative;min-height:112px;padding:18px 52px 20px 20px;display:flex;align-items:center;background:#10172bed;border:1px solid #fff;border-radius:10px;box-shadow:0 4px 18px #0008}
.box.named{border-top-left-radius:0}
#text{font-size:clamp(16px,2.4vw,25px);line-height:1.8;white-space:pre-wrap}
button{cursor:pointer;font-size:16px;font-weight:800;border-radius:10px;padding:11px 22px;border:1px solid #e2e8f0;background:#f8fafc;color:#111827}
button:hover{background:#bfdbfe}
.next{position:absolute;right:9px;bottom:8px;padding:3px 8px;border:0;background:transparent;color:white;font-size:28px}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.danger{background:#fca5a5}
.note{padding:10px 14px;color:#9ca3af;font-size:12px}
@media(max-width:600px){.stage{aspect-ratio:4/3;min-height:420px}.box{min-height:105px;padding:14px 44px 16px 14px}#text{font-size:17px}}
</style>
</head>

<div class="dialogue-area">
<div id="name" class="name"></div>
<div id="box" class="box"><div id="text">今日は憧れの田所先輩の家に遊びに行く日だ。</div><button id="next" class="next" aria-label="次へ">▸</button></div>
<div id="choices" class="choices"></div>
</div>
</section>
<div class="note">右下の ▸ を押してセリフを進めよう。</div>
</main>
<script>
const scenes = [
  {bg:"street", chapter:"プロローグ", name:"", text:"今日は憧れの田所先輩の家に遊びに行く日だ。"},
  {bg:"walk", chapter:"道中", name:"田所先輩", text:"行く時には結構行くねー。"},
  {bg:"street", chapter:"到着", name:"", text:"先輩と話していたら家に着いた。"},
  {bg:"door", chapter:"先輩の家", name:"田所先輩", text:"こ↑こ↓、入ってどうぞ"}
];
let index = 0;
const $ = id => document.getElementById(id);

function render() {
  const s = scenes[index];
  ["street","walk","door"].forEach(id => $(id).classList.toggle("active", id === s.bg));
  $("chapter").textContent = s.chapter;
  $("name").textContent = s.name;
  $("name").style.display = s.name ? "block" : "none";
  $("text").textContent = s.text;
  $("box").classList.toggle("named", !!s.name);
  $("next").style.display = "block";
  $("next").onclick = nextScene;
  $("choices").replaceChildren();
}
function nextScene() {
  if (index < scenes.length - 1) {
    index++;
    render();
  } else {
    showInvitation();
  }
}
function addChoice(label, fn, cls="") {
  const b = document.createElement("button");
  b.textContent = label;
  b.className = cls;
  b.onclick = fn;
  $("choices").appendChild(b);
}
function showInvitation() {
  $("chapter").textContent = "屋上への誘い";
  $("name").textContent = "田所先輩";
  $("name").style.display = "block";
  $("box").classList.add("named");
  $("text").textContent = "まずうちさぁ、屋上あんだけどぉ、焼いてかない？";
  $("next").style.display = "none";
  $("choices").replaceChildren();
  addChoice("する", accept);
  addChoice("しない", decline, "danger");
}
function accept() {
  $("chapter").textContent = "つづく";
  $("name").style.display = "none";
  $("box").classList.remove("named");
  $("text").textContent = "Aは「する」と答えた。\n田所先輩と一緒に屋上へ向かうことに……。";
  $("choices").replaceChildren();
  addChoice("最初から", restart);
}
function decline() {
  $("chapter").textContent = "ゲームオーバー";
  $("name").textContent = "田所先輩";
  $("name").style.display = "block";
  $("box").classList.add("named");
  $("text").textContent = "ファッ？！お前やりませんねぇスギィ！MURはん、こいつやっちゃいましょうよ！";
  $("next").style.display = "block";
  $("next").onclick = showMUR;
  $("choices").replaceChildren();
}
function showMUR() {
  $("chapter").textContent = "ゲームオーバー";
  $("name").textContent = "MUR";
  $("name").style.display = "block";
  $("text").textContent = "おっそうだな";
  $("next").style.display = "none";
  $("choices").replaceChildren();
  addChoice("GAME OVER（最初から）", restart, "danger");
}
function restart() {
  index = 0;
  render();
}
render();
</script>
</body>
